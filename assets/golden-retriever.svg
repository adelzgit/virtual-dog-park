<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a Golden Retriever">
  <!-- Background -->
  <circle cx="120" cy="120" r="118" fill="#fff4e0"/>

  <!-- Feathered golden tail (plume) -->
  <path d="M152 188 q44 -10 50 -52" fill="none" stroke="#e0b265" stroke-width="20" stroke-linecap="round"/>

  <!-- Feathered ears lying flat against the head -->
  <path d="M74 80 q-26 24 -16 70 q6 16 22 12 q4 -46 10 -80 z" fill="#d9a64f"/>
  <path d="M166 80 q26 24 16 70 q-6 16 -22 12 q-4 -46 -10 -80 z" fill="#d9a64f"/>

  <!-- Body: solid golden with feathered chest -->
  <path d="M62 206 q-4 -74 58 -74 q62 0 58 74 z" fill="#e6b766"/>
  <path d="M100 206 q0 -56 20 -56 q20 0 20 56 q-20 14 -40 0 z" fill="#f0cd8a"/>

  <!-- Front paws -->
  <ellipse cx="98" cy="208" rx="17" ry="10" fill="#f0cd8a"/>
  <ellipse cx="142" cy="208" rx="17" ry="10" fill="#f0cd8a"/>

  <!-- Head: golden -->
  <circle cx="120" cy="98" r="50" fill="#e6b766"/>

  <!-- Lighter cream muzzle -->
  <ellipse cx="120" cy="118" rx="30" ry="24" fill="#f3d596"/>
  <!-- Cream brows / friendly markings -->
  <path d="M96 84 q14 -10 24 -2" fill="none" stroke="#f3d596" stroke-width="6" stroke-linecap="round"/>
  <path d="M144 84 q-14 -10 -24 -2" fill="none" stroke="#f3d596" stroke-width="6" stroke-linecap="round"/>

  <!-- Eyes (warm dark) -->
  <circle cx="102" cy="96" r="7" fill="#3a2a18"/>
  <circle cx="138" cy="96" r="7" fill="#3a2a18"/>
  <circle cx="104" cy="94" r="2.2" fill="#fff"/>
  <circle cx="140" cy="94" r="2.2" fill="#fff"/>

  <!-- Nose and friendly mouth -->
  <ellipse cx="120" cy="112" rx="9" ry="6.5" fill="#2e2620"/>
  <path d="M120 118 v8 M120 126 q-9 6 -17 2 M120 126 q9 6 17 2" fill="none" stroke="#2e2620" stroke-width="2.5" stroke-linecap="round"/>
</svg>
