<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a Poodle">
  <!-- Background -->
  <circle cx="120" cy="120" r="118" fill="#fdeef6"/>

  <!-- Curly tail puff (behind body) -->
  <circle cx="196" cy="150" r="16" fill="#e9d3b8"/>
  <circle cx="190" cy="158" r="9" fill="#d8bd9c"/>

  <!-- Curly drop ears (behind head) -->
  <path d="M76 84 q-22 22 -14 64 q28 -4 30 -40 q0 -18 -16 -24 z" fill="#e0c4a6"/>
  <path d="M164 84 q22 22 14 64 q-28 -4 -30 -40 q0 -18 16 -24 z" fill="#e0c4a6"/>
  <circle cx="70" cy="120" r="6" fill="#d8bd9c"/>
  <circle cx="170" cy="120" r="6" fill="#d8bd9c"/>

  <!-- Curly body puff (scalloped cloud shape) -->
  <path d="M62 200
           q-18 -6 -14 -28 q-16 -10 -4 -30 q-10 -18 12 -24
           q4 -20 28 -14 q10 -16 30 -6 q20 -10 30 6
           q24 -6 28 14 q22 6 12 24 q12 20 -4 30 q4 22 -14 28 z"
        fill="#f0dcc1"/>
  <!-- Curl dots on body to suggest curls -->
  <g fill="#e0c4a6">
    <circle cx="92" cy="170" r="7"/><circle cx="120" cy="178" r="7"/>
    <circle cx="148" cy="170" r="7"/><circle cx="104" cy="150" r="6"/>
    <circle cx="136" cy="150" r="6"/><circle cx="120" cy="158" r="6"/>
    <circle cx="80" cy="186" r="6"/><circle cx="160" cy="186" r="6"/>
  </g>

  <!-- Front paws (shaved, slim) -->
  <ellipse cx="100" cy="206" rx="13" ry="8" fill="#f6e6d2"/>
  <ellipse cx="140" cy="206" rx="13" ry="8" fill="#f6e6d2"/>

  <!-- Head with curly topknot -->
  <circle cx="120" cy="96" r="46" fill="#f0dcc1"/>
  <g fill="#e0c4a6">
    <circle cx="100" cy="58" r="11"/><circle cx="120" cy="52" r="12"/>
    <circle cx="140" cy="58" r="11"/><circle cx="92" cy="74" r="9"/>
    <circle cx="148" cy="74" r="9"/><circle cx="120" cy="70" r="10"/>
  </g>

  <!-- Narrow muzzle -->
  <ellipse cx="120" cy="116" rx="22" ry="18" fill="#f6e6d2"/>

  <!-- Eyes -->
  <circle cx="106" cy="96" r="6.5" fill="#2e2620"/>
  <circle cx="134" cy="96" r="6.5" fill="#2e2620"/>
  <circle cx="108" cy="94" r="2" fill="#fff"/>
  <circle cx="136" cy="94" r="2" fill="#fff"/>

  <!-- Nose and mouth -->
  <ellipse cx="120" cy="110" rx="8" ry="6" fill="#2e2620"/>
  <path d="M120 116 v7 M120 123 q-7 5 -13 2 M120 123 q7 5 13 2" fill="none" stroke="#2e2620" stroke-width="2.4" stroke-linecap="round"/>
</svg>
